server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://gateway-service:8080;
        proxy_ssl_trusted_certificate /run/tls/ca.crt;
        proxy_ssl_verify on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
