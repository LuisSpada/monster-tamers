name: monster-tamers

services:
  postgres:
    image: postgres:18-alpine
    container_name: monster-tamers-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monster_tamers}
      POSTGRES_USER: ${POSTGRES_USER:-monster_tamers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - monster-tamers-network

  backend:
    container_name: monster-tamers-backend
    build:
      context: ../backend
      dockerfile: gateway-service/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-monster_tamers}
      DATABASE_USERNAME: ${POSTGRES_USER:-monster_tamers}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - monster-tamers-network

  frontend:
    container_name: monster-tamers-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - monster-tamers-network

volumes:
  postgres_data:
    name: monster-tamers-postgres-data

networks:
  monster-tamers-network:
    name: monster-tamers-network
    driver: bridge
