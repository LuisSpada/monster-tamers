services:
  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8081}
      PLAYER_SERVICE_URL: ${PLAYER_SERVICE_URL:-http://player-service:8082}
      MONSTER_SERVICE_URL: ${MONSTER_SERVICE_URL:-http://monster-service:8083}
      ENCOUNTER_SERVICE_URL: ${ENCOUNTER_SERVICE_URL:-http://encounter-service:8084}
      GATEWAY_CORS_ORIGIN_5173: ${GATEWAY_CORS_ORIGIN_5173:-http://localhost:5173}
      GATEWAY_CORS_ORIGIN_3000: ${GATEWAY_CORS_ORIGIN_3000:-http://localhost:3000}
    ports:
      - "8080:8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      AUTH_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-monster_tamers_auth}
      AUTH_DATABASE_USERNAME: ${POSTGRES_USER:-monster_tamers_auth}
      AUTH_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-development-only}
      JWT_SECRET: ${JWT_SECRET:-change-me-development-only-jwt-secret}
      PLAYER_BASE_URL: http://player-service:8082
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  player-service:
    build:
      context: .
      dockerfile: player-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      JWT_SECRET: ${JWT_SECRET:-change-me-development-only-jwt-secret}
      PLAYER_DATABASE_URL: jdbc:postgresql://player-postgres:5432/${PLAYER_POSTGRES_DB:-monster_tamers_player}
      PLAYER_DATABASE_USERNAME: ${PLAYER_POSTGRES_USER:-monster_tamers_player}
      PLAYER_DATABASE_PASSWORD: ${PLAYER_POSTGRES_PASSWORD:-change-me-development-only}
    depends_on:
      player-postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  monster-service:
    build:
      context: .
      dockerfile: monster-service/Dockerfile
    environment:
      SERVER_PORT: 8083
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  encounter-service:
    build:
      context: .
      dockerfile: encounter-service/Dockerfile
    environment:
      SERVER_PORT: 8084
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8084/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  simulator-service:
    build:
      context: .
      dockerfile: simulator-service/Dockerfile
    environment:
      SERVER_PORT: 8085
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8085/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monster_tamers_auth}
      POSTGRES_USER: ${POSTGRES_USER:-monster_tamers_auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-development-only}
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  player-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PLAYER_POSTGRES_DB:-monster_tamers_player}
      POSTGRES_USER: ${PLAYER_POSTGRES_USER:-monster_tamers_player}
      POSTGRES_PASSWORD: ${PLAYER_POSTGRES_PASSWORD:-change-me-development-only}
    volumes:
      - player-postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    driver: bridge

volumes:
  auth-postgres-data:
  player-postgres-data: