services:
  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    environment:
      SERVER_PORT: 8080
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: /run/tls/server.p12
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_ALIAS: gateway-service
      TLS_TRUST_STORE: /run/tls/truststore.p12
      TLS_TRUST_STORE_TYPE: PKCS12

      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-https://auth-service:8081}
      PLAYER_SERVICE_URL: ${PLAYER_SERVICE_URL:-https://player-service:8082}
      MONSTER_SERVICE_URL: ${MONSTER_SERVICE_URL:-https://monster-service:8083}
      ENCOUNTER_SERVICE_URL: ${ENCOUNTER_SERVICE_URL:-https://encounter-service:8084}

      GATEWAY_CORS_ORIGIN_5173: ${GATEWAY_CORS_ORIGIN_5173:-http://localhost:5173}
      GATEWAY_CORS_ORIGIN_3000: ${GATEWAY_CORS_ORIGIN_3000:-http://localhost:3000}
    ports:
      - "8080:8080"
    volumes:
      - ../infrastructure/runtime/tls/gateway-service/server.p12:/run/tls/server.p12:ro
      - ../infrastructure/runtime/tls/truststore.p12:/run/tls/truststore.p12:ro
      - ../infrastructure/runtime/tls/ca.crt:/run/tls/ca.crt:ro
    secrets:
      - tls_password
    depends_on:
      auth-service:
        condition: service_healthy
      player-service:
        condition: service_healthy
      monster-service:
        condition: service_healthy
      encounter-service:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - wget
        - --ca-certificate=/run/tls/ca.crt
        - --no-verbose
        - --tries=1
        - --spider
        - https://127.0.0.1:8080/actuator/health
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: /run/tls/server.p12
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_ALIAS: auth-service
      TLS_TRUST_STORE: /run/tls/truststore.p12
      TLS_TRUST_STORE_TYPE: PKCS12

      AUTH_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-monster_tamers_auth}
      AUTH_DATABASE_USERNAME: ${POSTGRES_USER:-monster_tamers_auth}
      AUTH_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-development-only}
      JWT_SECRET: ${JWT_SECRET:-change-me-development-only-jwt-secret}

      PLAYER_BASE_URL: ${PLAYER_BASE_URL:-https://player-service:8082}

      MAIL_MODE: ${MAIL_MODE:-logging}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_CONNECTION_TIMEOUT_MS: ${MAIL_CONNECTION_TIMEOUT_MS:-5000}
      MAIL_READ_TIMEOUT_MS: ${MAIL_READ_TIMEOUT_MS:-5000}
      MAIL_WRITE_TIMEOUT_MS: ${MAIL_WRITE_TIMEOUT_MS:-5000}
    volumes:
      - ../infrastructure/runtime/tls/auth-service/server.p12:/run/tls/server.p12:ro
      - ../infrastructure/runtime/tls/truststore.p12:/run/tls/truststore.p12:ro
      - ../infrastructure/runtime/tls/ca.crt:/run/tls/ca.crt:ro
    secrets:
      - tls_password
    depends_on:
      postgres:
        condition: service_healthy
      player-service:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - wget
        - --ca-certificate=/run/tls/ca.crt
        - --no-verbose
        - --tries=1
        - --spider
        - https://127.0.0.1:8081/actuator/health
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  player-service:
    build:
      context: .
      dockerfile: player-service/Dockerfile
    environment:
      SERVER_PORT: 8082
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: /run/tls/server.p12
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_ALIAS: player-service
      TLS_TRUST_STORE: /run/tls/truststore.p12
      TLS_TRUST_STORE_TYPE: PKCS12

      JWT_SECRET: ${JWT_SECRET:-change-me-development-only-jwt-secret}

      PLAYER_DATABASE_URL: jdbc:postgresql://player-postgres:5432/${PLAYER_POSTGRES_DB:-monster_tamers_player}
      PLAYER_DATABASE_USERNAME: ${PLAYER_POSTGRES_USER:-monster_tamers_player}
      PLAYER_DATABASE_PASSWORD: ${PLAYER_POSTGRES_PASSWORD:-change-me-development-only}

      MONSTER_BASE_URL: ${MONSTER_BASE_URL:-https://monster-service:8083}
    volumes:
      - ../infrastructure/runtime/tls/player-service/server.p12:/run/tls/server.p12:ro
      - ../infrastructure/runtime/tls/truststore.p12:/run/tls/truststore.p12:ro
      - ../infrastructure/runtime/tls/ca.crt:/run/tls/ca.crt:ro
    secrets:
      - tls_password
    depends_on:
      player-postgres:
        condition: service_healthy
      monster-service:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - wget
        - --ca-certificate=/run/tls/ca.crt
        - --no-verbose
        - --tries=1
        - --spider
        - https://127.0.0.1:8082/actuator/health
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  monster-service:
    build:
      context: .
      dockerfile: monster-service/Dockerfile
    environment:
      SERVER_PORT: 8083
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: /run/tls/server.p12
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_ALIAS: monster-service

      JWT_SECRET: ${JWT_SECRET:-change-me-development-only-jwt-secret}

      MONSTER_DATABASE_URL: jdbc:postgresql://monster-postgres:5432/${MONSTER_POSTGRES_DB:-monster_tamers_monster}
      MONSTER_DATABASE_USERNAME: ${MONSTER_POSTGRES_USER:-monster_tamers_monster}
      MONSTER_DATABASE_PASSWORD: ${MONSTER_POSTGRES_PASSWORD:-change-me-development-only}
    volumes:
      - ../infrastructure/runtime/tls/monster-service/server.p12:/run/tls/server.p12:ro
      - ../infrastructure/runtime/tls/ca.crt:/run/tls/ca.crt:ro
    secrets:
      - tls_password
    depends_on:
      monster-postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - wget
        - --ca-certificate=/run/tls/ca.crt
        - --no-verbose
        - --tries=1
        - --spider
        - https://127.0.0.1:8083/actuator/health
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  encounter-service:
    build:
      context: .
      dockerfile: encounter-service/Dockerfile
    environment:
      SERVER_PORT: 8084
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: /run/tls/server.p12
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_ALIAS: encounter-service
      TLS_TRUST_STORE: /run/tls/truststore.p12
      TLS_TRUST_STORE_TYPE: PKCS12

      JWT_SECRET: ${JWT_SECRET:-change-me-development-only-jwt-secret}

      ENCOUNTER_DATABASE_URL: jdbc:postgresql://encounter-postgres:5432/${ENCOUNTER_POSTGRES_DB:-monster_tamers_encounter}
      ENCOUNTER_DATABASE_USERNAME: ${ENCOUNTER_POSTGRES_USER:-monster_tamers_encounter}
      ENCOUNTER_DATABASE_PASSWORD: ${ENCOUNTER_POSTGRES_PASSWORD:-change-me-development-only}
      MONSTER_BASE_URL: ${ENCOUNTER_MONSTER_BASE_URL:-https://monster-service:8083}
      MONSTER_CONNECT_TIMEOUT: ${ENCOUNTER_MONSTER_CONNECT_TIMEOUT:-2s}
      MONSTER_READ_TIMEOUT: ${ENCOUNTER_MONSTER_READ_TIMEOUT:-3s}

      SIMULATOR_BASE_URL: ${SIMULATOR_BASE_URL:-https://simulator-service:8085}
      SIMULATOR_CONNECT_TIMEOUT: ${SIMULATOR_CONNECT_TIMEOUT:-2s}
      SIMULATOR_READ_TIMEOUT: ${SIMULATOR_READ_TIMEOUT:-5s}
    volumes:
      - ../infrastructure/runtime/tls/encounter-service/server.p12:/run/tls/server.p12:ro
      - ../infrastructure/runtime/tls/truststore.p12:/run/tls/truststore.p12:ro
      - ../infrastructure/runtime/tls/ca.crt:/run/tls/ca.crt:ro
    secrets:
      - tls_password
    depends_on:
      encounter-postgres:
        condition: service_healthy
      monster-service:
        condition: service_healthy
      simulator-service:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - wget
        - --ca-certificate=/run/tls/ca.crt
        - --no-verbose
        - --tries=1
        - --spider
        - https://127.0.0.1:8084/actuator/health
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  simulator-service:
    build:
      context: .
      dockerfile: simulator-service/Dockerfile
    environment:
      SERVER_PORT: 8085
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: /run/tls/server.p12
      SERVER_SSL_KEY_STORE_TYPE: PKCS12
      SERVER_SSL_KEY_ALIAS: simulator-service

      JWT_SECRET: ${JWT_SECRET:-change-me-development-only-jwt-secret}
    volumes:
      - ../infrastructure/runtime/tls/simulator-service/server.p12:/run/tls/server.p12:ro
      - ../infrastructure/runtime/tls/ca.crt:/run/tls/ca.crt:ro
    secrets:
      - tls_password
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - wget
        - --ca-certificate=/run/tls/ca.crt
        - --no-verbose
        - --tries=1
        - --spider
        - https://127.0.0.1:8085/actuator/health
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build: ../frontend
    ports:
      - "3000:80"
    volumes:
      - ../infrastructure/runtime/tls/ca.crt:/run/tls/ca.crt:ro
    depends_on:
      gateway-service:
        condition: service_healthy
    networks:
      - backend

  tls-init:
    build: ../infrastructure/tls
    profiles: [setup]
    volumes:
      - ..:/repo
    environment:
      TLS_PASSWORD: ${TLS_PASSWORD:-change-me-development-only}

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monster_tamers_auth}
      POSTGRES_USER: ${POSTGRES_USER:-monster_tamers_auth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-development-only}
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5

  player-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PLAYER_POSTGRES_DB:-monster_tamers_player}
      POSTGRES_USER: ${PLAYER_POSTGRES_USER:-monster_tamers_player}
      POSTGRES_PASSWORD: ${PLAYER_POSTGRES_PASSWORD:-change-me-development-only}
    volumes:
      - player-postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5

  monster-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${MONSTER_POSTGRES_DB:-monster_tamers_monster}
      POSTGRES_USER: ${MONSTER_POSTGRES_USER:-monster_tamers_monster}
      POSTGRES_PASSWORD: ${MONSTER_POSTGRES_PASSWORD:-change-me-development-only}
    volumes:
      - monster-postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5

  encounter-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ENCOUNTER_POSTGRES_DB:-monster_tamers_encounter}
      POSTGRES_USER: ${ENCOUNTER_POSTGRES_USER:-monster_tamers_encounter}
      POSTGRES_PASSWORD: ${ENCOUNTER_POSTGRES_PASSWORD:-change-me-development-only}
    volumes:
      - encounter-postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    driver: bridge

volumes:
  auth-postgres-data:
  player-postgres-data:
  monster-postgres-data:
  encounter-postgres-data:

secrets:
  tls_password:
    file: ../infrastructure/runtime/tls/tls-password.txt