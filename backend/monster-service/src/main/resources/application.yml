spring:
  application:
    name: monster-service
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    doc-expansion: none
    tags-sorter: alpha
    operations-sorter: alpha
server:
  port: ${MONSTER_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info
