spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/auth/(?<segment>.*), /api/$\{segment}
            - id: player-service
              uri: ${PLAYER_SERVICE_URL:http://player-service:8082}
              predicates:
                - Path=/api/players/**
            - id: monster-service
              uri: ${MONSTER_SERVICE_URL:http://monster-service:8083}
              predicates:
                - Path=/api/monsters/**
            - id: encounter-service
              uri: ${ENCOUNTER_SERVICE_URL:http://encounter-service:8084}
              predicates:
                - Path=/api/encounters/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${GATEWAY_CORS_ORIGIN_5173:http://localhost:5173}
                  - ${GATEWAY_CORS_ORIGIN_3000:http://localhost:3000}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
server:
  port: ${GATEWAY_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
