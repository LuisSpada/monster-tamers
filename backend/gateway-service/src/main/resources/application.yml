spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
              predicates:
                - Path=/api/auth/**
            - id: auth-service-docs
              uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
              predicates:
                - Path=/docs/auth/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: player-service
              uri: ${PLAYER_SERVICE_URL:http://player-service:8082}
              predicates:
                - Path=/api/players/**
            - id: player-service-docs
              uri: ${PLAYER_SERVICE_URL:http://player-service:8082}
              predicates:
                - Path=/docs/players/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: monster-service
              uri: ${MONSTER_SERVICE_URL:http://monster-service:8083}
              predicates:
                - Path=/api/monsters/**
            - id: monster-service-docs
              uri: ${MONSTER_SERVICE_URL:http://monster-service:8083}
              predicates:
                - Path=/docs/monsters/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: encounter-service
              uri: ${ENCOUNTER_SERVICE_URL:http://encounter-service:8084}
              predicates:
                - Path=/api/encounters/**
            - id: encounter-service-docs
              uri: ${ENCOUNTER_SERVICE_URL:http://encounter-service:8084}
              predicates:
                - Path=/docs/encounters/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${GATEWAY_CORS_ORIGIN_5173:http://localhost:5173}
                  - ${GATEWAY_CORS_ORIGIN_3000:http://localhost:3000}
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    doc-expansion: none
    tags-sorter: alpha
    operations-sorter: alpha
    urls:
      - name: auth
        url: /docs/auth/v3/api-docs
      - name: players
        url: /docs/players/v3/api-docs
      - name: monsters
        url: /docs/monsters/v3/api-docs
      - name: encounters
        url: /docs/encounters/v3/api-docs
server:
  port: ${GATEWAY_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
