spring:
  application:
    name: monster-tamers-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/monster_tamers}
    username: ${DATABASE_USERNAME:monster_tamers}
    password: ${DATABASE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${BACKEND_PORT:8080}
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
management:
  endpoints:
    web:
      exposure:
        include: health,info
