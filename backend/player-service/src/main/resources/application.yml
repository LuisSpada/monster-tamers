spring:
  application:
    name: player-service
  datasource:
    url: ${PLAYER_DATABASE_URL:jdbc:postgresql://localhost:5432/monster_tamers_player}
    username: ${PLAYER_DATABASE_USERNAME:monster_tamers_player}
    password: ${PLAYER_DATABASE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    doc-expansion: none
    tags-sorter: alpha
    operations-sorter: alpha

server:
  port: ${PLAYER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info