spring:
  application:
    name: auth-service

  datasource:
    url: ${AUTH_DATABASE_URL:jdbc:postgresql://localhost:5432/monster_tamers}
    username: ${AUTH_DATABASE_USERNAME:monster_tamers}
    password: ${AUTH_DATABASE_PASSWORD:change-me}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}

  player:
    base-url: ${PLAYER_BASE_URL:https://localhost:8082}
    connect-timeout: ${PLAYER_CONNECT_TIMEOUT:2s}
    read-timeout: ${PLAYER_READ_TIMEOUT:3s}

  mail:
    mode: ${MAIL_MODE:logging}
    from: ${MAIL_FROM:}
    smtp:
      host: ${MAIL_HOST:}
      port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      auth: ${MAIL_SMTP_AUTH:true}
      starttls: ${MAIL_STARTTLS:true}
      connection-timeout-ms: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
      read-timeout-ms: ${MAIL_READ_TIMEOUT_MS:5000}
      write-timeout-ms: ${MAIL_WRITE_TIMEOUT_MS:5000}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}

  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    doc-expansion: none
    tags-sorter: alpha
    operations-sorter: alpha

server:
  port: ${SERVER_PORT:8081}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    key-store: ${SERVER_SSL_KEY_STORE:}
    key-store-type: ${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:}
    key-alias: ${SERVER_SSL_KEY_ALIAS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info