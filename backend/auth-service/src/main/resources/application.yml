spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DATABASE_URL:jdbc:postgresql://localhost:5432/monster_tamers}
    username: ${AUTH_DATABASE_USERNAME:monster_tamers}
    password: ${AUTH_DATABASE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${AUTH_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info
