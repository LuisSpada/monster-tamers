spring:
  datasource:
    url: jdbc:h2:mem:monster_tamers;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-at-least-32-bytes-long
    access-token-ttl: 15m

  player:
    base-url: http://localhost:8082
    connect-timeout: 2s
    read-timeout: 3s

  mail:
    mode: logging