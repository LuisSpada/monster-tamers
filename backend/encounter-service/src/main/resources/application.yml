spring:
  application:
    name: encounter-service

  datasource:
    url: ${ENCOUNTER_DATABASE_URL:jdbc:postgresql://localhost:5432/monster_tamers_encounter}
    username: ${ENCOUNTER_DATABASE_USERNAME:monster_tamers_encounter}
    password: ${ENCOUNTER_DATABASE_PASSWORD:change-me}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  http:
    serviceclient:
      monster:
        base-url: ${MONSTER_BASE_URL:https://localhost:8083}
        connect-timeout: ${MONSTER_CONNECT_TIMEOUT:2s}
        read-timeout: ${MONSTER_READ_TIMEOUT:3s}

      simulator:
        base-url: ${SIMULATOR_BASE_URL:https://localhost:8085}
        connect-timeout: ${SIMULATOR_CONNECT_TIMEOUT:2s}
        read-timeout: ${SIMULATOR_READ_TIMEOUT:5s}

app:
  jwt:
    secret: ${JWT_SECRET:}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}

  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    doc-expansion: none
    tags-sorter: alpha
    operations-sorter: alpha

server:
  port: ${SERVER_PORT:8084}

  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    key-store: ${SERVER_SSL_KEY_STORE:}
    key-store-type: ${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD:}
    key-alias: ${SERVER_SSL_KEY_ALIAS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info