spring:
  application:
    name: encounter-service
  datasource:
    url: ${ENCOUNTER_DATABASE_URL:jdbc:postgresql://localhost:5432/monster_tamers_encounter}
    username: ${ENCOUNTER_DATABASE_USERNAME:monster_tamers_encounter}
    password: ${ENCOUNTER_DATABASE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:}
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    doc-expansion: none
    tags-sorter: alpha
    operations-sorter: alpha
server:
  port: ${ENCOUNTER_PORT:8084}
management:
  endpoints:
    web:
      exposure:
        include: health,info
