spring:
  application:
    name: encounter-service
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    doc-expansion: none
    tags-sorter: alpha
    operations-sorter: alpha
server:
  port: ${ENCOUNTER_PORT:8084}
management:
  endpoints:
    web:
      exposure:
        include: health,info
