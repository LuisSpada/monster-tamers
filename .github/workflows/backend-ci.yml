name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - release/v1
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify all backend modules
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify all backend modules
        run: >
          ./mvnw
          --batch-mode
          --no-transfer-progress
          clean
          verify

  service-verify:
    name: Verify ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway-service
          - auth-service
          - player-service
          - monster-service
          - encounter-service
          - simulator-service

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify service and required modules
        env:
          SERVICE: ${{ matrix.service }}
        run: >
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -pl "$SERVICE"
          -am
          clean
          verify