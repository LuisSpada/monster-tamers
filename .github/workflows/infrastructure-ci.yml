name: Infrastructure CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "infrastructure/**"
      - ".github/workflows/infrastructure-ci.yml"
  push:
    branches:
      - main
      - release/v1
    paths:
      - "backend/**"
      - "frontend/**"
      - "infrastructure/**"
      - ".github/workflows/infrastructure-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate HTTPS Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate temporary TLS password
        shell: bash
        run: |
          TLS_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$TLS_PASSWORD"
          echo "TLS_PASSWORD=$TLS_PASSWORD" >> "$GITHUB_ENV"

      - name: Generate temporary TLS certificates
        shell: pwsh
        run: |
          ./infrastructure/tls/generate-local-certificates.ps1 `
            -Password $env:TLS_PASSWORD `
            -Force

      - name: Verify generated TLS material is ignored
        shell: bash
        run: |
          git check-ignore infrastructure/runtime/tls/ca.key
          git check-ignore infrastructure/runtime/tls/truststore.p12
          git check-ignore infrastructure/runtime/tls/tls-password.txt
          git check-ignore infrastructure/runtime/tls/gateway-service/server.p12

          if git ls-files | grep -E 'runtime/tls|\.p12$|\.key$|tls-password'; then
            echo "Generated TLS material must not be tracked."
            exit 1
          fi

      - name: Validate Docker Compose configuration
        shell: bash
        run: |
          docker compose \
            -f backend/compose.yaml \
            config --quiet

      - name: Build application images
        shell: bash
        run: |
          docker compose \
            -f backend/compose.yaml \
            build

      - name: Start HTTPS stack
        shell: bash
        run: |
          docker compose \
            -f backend/compose.yaml \
            up -d

      - name: Wait for HTTPS Gateway
        shell: bash
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 30 \
            --retry-delay 2 \
            --retry-all-errors \
            --cacert infrastructure/runtime/tls/ca.crt \
            https://localhost:8080/actuator/health

      - name: Verify Gateway routes over HTTPS
        shell: bash
        run: |
          for path in \
            docs/auth/v3/api-docs \
            docs/players/v3/api-docs \
            docs/monsters/v3/api-docs \
            docs/encounters/v3/api-docs
          do
            curl \
              --fail \
              --show-error \
              --silent \
              --cacert infrastructure/runtime/tls/ca.crt \
              "https://localhost:8080/$path" \
              > /dev/null
          done

      - name: Verify plaintext HTTP is rejected
        shell: bash
        run: |
          if curl \
            --fail \
            --silent \
            --max-time 5 \
            http://localhost:8080/actuator/health \
            > /dev/null 2>&1
          then
            echo "Gateway unexpectedly accepted plaintext HTTP."
            exit 1
          fi

      - name: Verify container health
        shell: bash
        run: |
          docker compose \
            -f backend/compose.yaml \
            ps

          unhealthy="$(
            docker compose \
              -f backend/compose.yaml \
              ps --format json |
            jq -r '
              select(
                .Health != "healthy" and
                .Health != ""
              ) |
              .Service + ": " + .Health
            '
          )"

          if [ -n "$unhealthy" ]; then
            echo "Unhealthy services:"
            echo "$unhealthy"
            exit 1
          fi

      - name: Show service logs after failure
        if: failure()
        shell: bash
        run: |
          docker compose \
            -f backend/compose.yaml \
            ps

          docker compose \
            -f backend/compose.yaml \
            logs \
            --no-color \
            --tail 200

      - name: Stop stack
        if: always()
        shell: bash
        run: |
          docker compose \
            -f backend/compose.yaml \
            down -v \
            --remove-orphans