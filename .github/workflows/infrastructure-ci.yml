name: Infrastructure CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "infrastructure/**"
      - ".github/workflows/infrastructure-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "infrastructure/**"
      - ".github/workflows/infrastructure-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate Compose and build images
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose -f infrastructure/compose.yaml config --quiet

      - name: Build application images
        run: docker compose -f infrastructure/compose.yaml build
