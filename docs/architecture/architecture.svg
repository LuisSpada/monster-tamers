<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title description">
  <title id="title">Monster Tamers implemented microservice architecture</title>
  <desc id="description">The frontend calls the public HTTPS API Gateway. The gateway routes to Auth, Player, Monster and Encounter services. Auth calls Player, Player calls Monster, and Encounter calls Monster and Simulator directly over the private network. Auth, Player, Monster and Encounter each own a PostgreSQL database.</desc>
  <defs>
    <marker id="public-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="internal-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="database-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
    <style>
      .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 12; }
      .internal-box { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 12; }
      .db { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .label { font: 600 18px sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 14px sans-serif; fill: #475569; text-anchor: middle; }
      .public-line { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#public-arrow); }
      .internal-line { stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 7 5; fill: none; marker-end: url(#internal-arrow); }
      .database-line { stroke: #059669; stroke-width: 2; fill: none; marker-end: url(#database-arrow); }
      .title { font: 700 26px sans-serif; fill: #0f172a; text-anchor: middle; }
      .boundary { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 9 6; rx: 18; }
      .boundary-label { font: 600 14px sans-serif; fill: #64748b; }
      .legend { font: 14px sans-serif; fill: #334155; }
    </style>
  </defs>
  <text x="600" y="36" class="title">Monster Tamers implemented microservice architecture</text>

  <rect x="430" y="60" width="340" height="78" class="boundary"/>
  <text x="445" y="82" class="boundary-label">Public client</text>
  <rect x="490" y="88" width="220" height="58" class="box"/>
  <text x="600" y="115" class="label">React frontend</text>
  <text x="600" y="135" class="small">browser client</text>

  <rect x="65" y="175" width="1070" height="380" class="boundary"/>
  <text x="80" y="198" class="boundary-label">Private backend network</text>

  <rect x="490" y="215" width="220" height="58" class="box"/>
  <text x="600" y="242" class="label">API Gateway</text>
  <text x="600" y="262" class="small">only public backend entry point</text>
  <path d="M600 146 L600 215" class="public-line"/>

  <rect x="105" y="330" width="190" height="58" class="box"/>
  <text x="200" y="365" class="label">Auth Service</text>
  <rect x="365" y="330" width="190" height="58" class="box"/>
  <text x="460" y="365" class="label">Player Service</text>
  <rect x="645" y="330" width="190" height="58" class="box"/>
  <text x="740" y="365" class="label">Monster Service</text>
  <rect x="905" y="330" width="190" height="58" class="box"/>
  <text x="1000" y="365" class="label">Encounter Service</text>

  <path d="M550 273 L550 292 L200 292 L200 330" class="public-line"/>
  <path d="M585 273 L585 304 L460 304 L460 330" class="public-line"/>
  <path d="M615 273 L615 304 L740 304 L740 330" class="public-line"/>
  <path d="M650 273 L650 292 L1000 292 L1000 330" class="public-line"/>

  <path d="M295 374 L365 374" class="internal-line"/>
  <text x="330" y="410" class="small">create player</text>
  <path d="M555 374 L645 374" class="internal-line"/>
  <text x="600" y="410" class="small">initialize collection</text>
  <path d="M905 374 L835 374" class="internal-line"/>
  <text x="870" y="410" class="small">load battle monsters</text>

  <path d="M1000 388 L1000 450" class="internal-line"/>

  <rect x="65" y="615" width="1070" height="150" class="boundary"/>
  <text x="80" y="750" class="boundary-label">Service-owned data stores</text>

  <rect x="105" y="650" width="190" height="68" class="db"/>
  <text x="200" y="678" class="label">
    <tspan x="200">Auth</tspan>
    <tspan x="200" dy="22">PostgreSQL</tspan>
  </text>
  <rect x="365" y="650" width="190" height="68" class="db"/>
  <text x="460" y="678" class="label">
    <tspan x="460">Player</tspan>
    <tspan x="460" dy="22">PostgreSQL</tspan>
  </text>
  <rect x="645" y="650" width="190" height="68" class="db"/>
  <text x="740" y="678" class="label">
    <tspan x="740">Monster</tspan>
    <tspan x="740" dy="22">PostgreSQL</tspan>
  </text>
  <rect x="905" y="650" width="190" height="68" class="db"/>
  <text x="1000" y="678" class="label">
    <tspan x="1000">Encounter</tspan>
    <tspan x="1000" dy="22">PostgreSQL</tspan>
  </text>

  <path d="M200 388 L200 650" class="database-line"/>
  <path d="M460 388 L460 650" class="database-line"/>
  <path d="M740 388 L740 650" class="database-line"/>
  <path d="M1070 388 L1070 532 L1000 532 L1000 650" class="database-line"/>

  <rect x="905" y="450" width="190" height="58" class="box"/>
  <text x="1000" y="485" class="label">Simulator Service</text>

  <line x1="80" y1="815" x2="125" y2="815" class="public-line"/>
  <text x="140" y="820" class="legend">Gateway-routed HTTPS</text>
  <line x1="350" y1="815" x2="395" y2="815" class="internal-line"/>
  <text x="410" y="820" class="legend">Direct internal HTTPS</text>
  <line x1="680" y1="815" x2="725" y2="815" class="database-line"/>
  <text x="740" y="820" class="legend">Database ownership</text>
</svg>
